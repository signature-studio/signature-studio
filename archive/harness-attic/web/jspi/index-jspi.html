<!doctype html>
<meta charset="utf-8">
<title>flengine6.wasm (JSPI build) in the browser</title>
<style>body{font:13px monospace;margin:1em}#log{white-space:pre;max-height:70vh;overflow:auto;border:1px solid #888;padding:.5em}</style>
<h3>flengine6.wasm (FLEngine + 5 modules, a4), JSPI build, in a Web Worker</h3>
<p>Parameters: <code>?auto=1&amp;cfg=&lt;JSON of globalThis.JSPI_CFG, see lift/harness/wasm/jspi_hooks.c&gt;&amp;root=/data</code>
(the emscripten_return_address import is always replaced by () =&gt; 0, as FLE_WASM_FAST_RETADDR=1).</p>
<div id="log"></div>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const cfg = {
  cmd: 'run',
  glue: new URL('../dist/flengine6.web.js', location.href).href,
  wasm: new URL('../dist/flengine6.wasm', location.href).href,
  dataBase: new URL('../dist/data/', location.href).href,
  root: q.get('root') || '/data',
  jspiCfg: q.get('cfg') ? JSON.parse(q.get('cfg')) : {},
};
const logEl = document.getElementById('log');
window.__done = false;
const stdout = [];
const w = new Worker('fle-worker-jspi.js');
const t0 = performance.now();
w.onmessage = (ev) => {
  const m = ev.data;
  if (m.type === 'stdout' || m.type === 'stderr') { stdout.push(m.line); logEl.textContent += (m.type === 'stderr' ? '[err] ' : '') + m.line + '\n'; return; }
  if (m.type === 'done' || m.type === 'error') {
    window.__result = m;
    window.__result.cfg = cfg;
    window.__result.page_ms = +(performance.now() - t0).toFixed(1);
    window.__done = true;
  }
};
w.onerror = (ev) => { window.__result = { type: 'error', phase: 'worker.onerror', message: String(ev.message), cfg }; window.__done = true; };
w.postMessage(cfg);
</script>
