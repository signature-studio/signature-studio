on:
  push:
    branches: main
    paths:
      - app/**
      - lift/**
      - ci/**
      - .github/workflows/deploy.yml
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
      RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
      RUNS_ON_S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix app && npm run build --prefix app
      - run: cargo build --release --locked --manifest-path lift/Cargo.toml
      - run: lift/target/release/fe-build endpoint
      - id: cache
        uses: runs-on/cache@v5.0.7
        with:
          path: lift/out-app/host
          key: host-${{ hashFiles('ci/**', 'app/scripts/**/*.mjs') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p lift/out-app/host && aws s3 cp \
            s3://fl-web-artifacts/installers/flstudio_win64_26.1.7.5653.exe \
            lift/out-app/in.exe
          node app/scripts/extract-fl.mjs lift/out-app/in.exe \
            lift/out-app/host --dlls ci/extract-dlls.tsv \
            --seed lift/harness/seeds/vfs-seed-idle1.tsv
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.12
      - run: printf '%s\n' "$(dirname "$(which emcc)")/../bin" >> $GITHUB_PATH
      - run: lift/target/release/fe-build engine
      - run: lift/target/release/fe-build bundle
      - run: lift/target/release/fe-build upload
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: app
          command: deploy
