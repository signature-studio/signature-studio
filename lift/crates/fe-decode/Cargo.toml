[package]
name = "fe-decode"
description = "x86-64 decoding (iced-x86) and recursive-descent reachability over a PE image's .text"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fe_decode"
path = "src/lib.rs"

[[bin]]
name = "fe-decode"
path = "src/main.rs"

[dependencies]
fe-pe = { path = "../fe-pe" }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
