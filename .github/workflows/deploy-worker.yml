# Worker fl-studio-web を本番に出す(決定 0379)。app/ か、このファイルが main に入ったときに動く。
# 版の bindings と vars は、いま 100% の版から実行時に読む。書き込み(versions upload)より前に検査を全部終える。
# 新しい版は versions upload で作り、versions deploy で 100% にする(トリガー = カスタムドメインには触れない: 決定 0217)。
# 確かめで外れていれば、直前の版へ戻して失敗にする。バケット名・アクセス設定・アカウント ID はログに出さない。
# 版の upload と 100% の切り替えは cloudflare/wrangler-action(旧 deploy.yml と同じ版・SHA)。配信の後、公開の入口が Access の背後にあることを probe で確かめる(宛先はカスタムドメインの一覧。得られなければ Secret PUBLIC_HOSTNAME。どちらも無ければ配信の前に止める)。
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: "リポジトリを取得する"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Node 24 を用意する"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: "依存関係を入れる"
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund

      - id: build
        name: "build(型検査と vite build。dist が出来たことを確かめる)"
        run: |
          npm run build --prefix app
          test -s app/dist/index.html

      - id: unit
        name: "test(vitest)"
        run: npm test --prefix app

      - id: worker
        name: "test:worker(wrangler dev --local。Cloudflare には触れない)"
        run: npm run test:worker --prefix app

      - id: read
        name: "今 100% の版と、この Worker のカスタムドメインの一覧を読む(書き込まない。値は読んだ直後に伏せる)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          W="$RUNNER_TEMP/deploy-worker"
          mkdir -p "$W"
          cat > "$W/cf.py" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          API = "https://api.cloudflare.com/client/v4"
          SCRIPT = "fl-studio-web"
          UUID = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          HOST = r"([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}"
          PLAIN = ("ACCESS_TEAM_DOMAIN", "ACCESS_AUD")
          R2 = ("ASSETS_BUCKET", "PERF_BUCKET")
          ENV_NAME = {"ACCESS_TEAM_DOMAIN": "ACCESS_TEAM_DOMAIN", "ACCESS_AUD": "ACCESS_AUD",
                      "ASSETS_BUCKET": "ASSETS_BUCKET_NAME", "PERF_BUCKET": "PERF_BUCKET_NAME"}


          def utc():
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


          def fail(msg):
              print("失敗: " + msg, file=sys.stderr, flush=True)
              sys.exit(1)


          def mask(value):
              print("::add-mask::" + value, flush=True)


          def out_file(var, name, value):
              if "\n" in value:
                  fail("値に改行がある(書かない)")
              with open(os.environ[var], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")


          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                  "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      status, body = r.status, r.read()
              except urllib.error.HTTPError as e:
                  status, body = e.code, e.read()
              try:
                  d = json.loads(body)
              except ValueError:
                  d = {}
              return status, (d if isinstance(d, dict) else {})


          def result(status, d, what):
              if status != 200 or d.get("success") is not True:
                  codes = sorted({str(e.get("code")) for e in (d.get("errors") or []) if isinstance(e, dict)})
                  fail(f"{what}: HTTP {status}、エラーの番号 {', '.join(codes) or '無し'}")
              return d.get("result")


          def base(acct):
              return f"/accounts/{acct}/workers/scripts/{SCRIPT}"


          def latest(acct):
              st, d = get(base(acct) + "/deployments")
              deps = (result(st, d, "deployments") or {}).get("deployments") or []
              if not deps or not isinstance(deps[0], dict):
                  fail("deployments が空")
              return deps[0]


          def cmd_read():
              st, d = get("/accounts")
              accounts = result(st, d, "アカウント一覧") or []
              ids = [a.get("id") for a in accounts if isinstance(a, dict)]
              if len(ids) != 1 or not re.fullmatch(r"[0-9a-f]{32}", str(ids[0])):
                  fail(f"アカウントが {len(ids)} 件。1 件のときだけ進める")
              acct = ids[0]
              mask(acct)
              out_file("GITHUB_ENV", "CLOUDFLARE_ACCOUNT_ID", acct)

              top = latest(acct)
              vers = top.get("versions") or []
              if len(vers) != 1 or vers[0].get("percentage") != 100 or not re.fullmatch(UUID, str(vers[0].get("version_id"))):
                  fail(f"最新の deployment の版は {len(vers)} 件。100% の版 1 件のときだけ進める")
              old = vers[0]["version_id"]
              print(f"現在 100% の版: {old}(作成 UTC {top.get('created_on')})", flush=True)

              st, d = get(base(acct) + f"/versions/{old}")
              res = result(st, d, "版の詳細") or {}
              holder = res.get("resources") if isinstance(res.get("resources"), dict) else {}
              print("版の応答のキー名: " + ", ".join(sorted(res.keys()))
                    + "; resources: " + ", ".join(sorted(holder.keys())), flush=True)
              if "bindings" in holder:
                  b = holder["bindings"]
              elif "bindings" in res:
                  b = res["bindings"]
              else:
                  fail("版の応答に bindings が無い(上にキー名を出した)")
              if isinstance(b, dict) and "type" in b and "name" in b:
                  b = [b]
              if isinstance(b, list):
                  items = [(x.get("name"), x) for x in b if isinstance(x, dict)]
              elif isinstance(b, dict):
                  items = [(k, v if isinstance(v, dict) else {}) for k, v in b.items()]
              else:
                  fail("bindings の形が配列でも辞書でもない")

              found, extra = {}, []
              for name, x in items:
                  t = x.get("type")
                  if name in PLAIN and t == "plain_text":
                      found[name] = x.get("text")
                  elif name in R2 and t == "r2_bucket":
                      found[name] = x.get("bucket_name")
                  elif name == "ASSETS" and t == "assets":
                      continue
                  else:
                      extra.append(f"{t}:{name}")
              if extra:
                  fail("この workflow が作らない binding が現在の版にある(型:名前): " + ", ".join(str(e) for e in extra))
              missing = [n for n in PLAIN + R2 if not isinstance(found.get(n), str) or not found.get(n).strip()]
              if missing:
                  fail("値が読めない binding: " + ", ".join(missing))
              for name in PLAIN + R2:
                  mask(found[name])
                  out_file("GITHUB_ENV", ENV_NAME[name], found[name])
              print("読んだ binding(値は伏せた): 変数 " + ", ".join(PLAIN) + "、R2 " + ", ".join(R2), flush=True)
              st, d = get(f"/accounts/{acct}/workers/domains?service={SCRIPT}")
              hosts = [x.get("hostname") for x in (d.get("result") or []) if isinstance(x, dict) and x.get("service") == SCRIPT] if st == 200 and d.get("success") is True else None
              if hosts is None:
                  codes = sorted({str(e.get("code")) for e in (d.get("errors") or []) if isinstance(e, dict)})
                  print(f"カスタムドメインの一覧: HTTP {st}、エラーの番号 {', '.join(codes) or '無し'}(公開ホスト名は一覧から得られない)", flush=True)
              elif len(hosts) == 1 and isinstance(hosts[0], str) and re.fullmatch(HOST, hosts[0]):
                  mask(hosts[0])
                  out_file("GITHUB_OUTPUT", "public_host", hosts[0])
                  print("カスタムドメインの一覧: この Worker の件数 1(値は伏せた。公開ホスト名に使う)", flush=True)
              else:
                  print(f"カスタムドメインの一覧: この Worker の件数 {len(hosts)}。公開ホスト名には使わない(1 件で形が正しいときだけ使う)", flush=True)
              out_file("GITHUB_OUTPUT", "old_version", old)
              print(f"読み取りの完了(UTC {utc()})。ここまでに Cloudflare へ書いていない", flush=True)


          def cmd_check(expected):
              top = latest(os.environ["CLOUDFLARE_ACCOUNT_ID"])
              vers = top.get("versions") or []
              if len(vers) != 1 or vers[0].get("percentage") != 100 or vers[0].get("version_id") != expected:
                  print(f"確かめ: 最新の deployment は版 {len(vers)} 件。期待の版 {expected} が 100% ではない", flush=True)
                  return 1
              print(f"確かめ: 最新の deployment(UTC {top.get('created_on')})は版 {expected} が 100%", flush=True)
              return 0


          def main(argv):
              if argv[1:2] == ["read"]:
                  cmd_read()
                  return 0
              if argv[1:2] == ["check"] and len(argv) == 3:
                  return cmd_check(argv[2])
              print("usage: cf.py read | cf.py check VERSION", file=sys.stderr)
              return 64


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          PY
          python3 "$W/cf.py" read

      - id: gen
        name: "配信設定を作る(app/wrangler.deploy.json。値は出さない)"
        run: |
          set -eu
          W="$RUNNER_TEMP/deploy-worker"
          python3 ci/lib/wrangler_config.py app/wrangler.jsonc app/wrangler.deploy.json > "$W/gen.out" 2> "$W/gen.err" || { echo "配信設定を作れなかった(理由は下の行)"; cat "$W/gen.err"; exit 1; }
          python3 - app/wrangler.deploy.json <<'PY'
          import json
          import sys

          c = json.load(open(sys.argv[1], encoding="utf-8"))
          buckets = c.get("r2_buckets") or []
          bs = sorted(b.get("binding") for b in buckets)
          vars_ = c.get("vars") or {}
          vs = sorted(vars_.keys())
          ok = (c.get("name") == "fl-studio-web" and c.get("workers_dev") is False
                and c.get("preview_urls") is False and not c.get("routes") and not c.get("route")
                and bs == ["ASSETS_BUCKET", "PERF_BUCKET"] and vs == ["ACCESS_AUD", "ACCESS_TEAM_DOMAIN"]
                and all(isinstance(v, str) and v for v in vars_.values())
                and all(b.get("bucket_name") for b in buckets))
          print(f"配信設定の検査: name {c.get('name')}、workers_dev と preview_urls は false、route は無し、"
                f"R2 {bs}、vars {vs}、判定 {ok}")
          sys.exit(0 if ok else 1)
          PY

      - id: host
        name: "公開ホスト名を決める(一覧から得た物。無ければ Secret PUBLIC_HOSTNAME。どちらも無い・形が違うときは、Cloudflare に書く前に止める)"
        env:
          FROM_LIST: ${{ steps.read.outputs.public_host }}
          FROM_SECRET: ${{ secrets.PUBLIC_HOSTNAME }}
        run: |
          set -u
          echo "CI_SHORT_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          if [ -n "$FROM_LIST" ]; then
            H="$FROM_LIST"; SRC="カスタムドメインの一覧"
          elif [ -n "$FROM_SECRET" ]; then
            H="$FROM_SECRET"; SRC="Secret PUBLIC_HOSTNAME"
          else
            echo "公開ホスト名が無い(一覧から得られず、Secret PUBLIC_HOSTNAME も無い)。配信の後の確かめ(probe)の宛先が無いので、配信の前に止めた。Cloudflare へは書いていない"
            exit 1
          fi
          if ! echo "$H" | grep -Eq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'; then
            echo "公開ホスト名の形が違う(値は書かない)。配信の前に止めた。Cloudflare へは書いていない"
            exit 1
          fi
          echo "::add-mask::$H"
          echo "public_host=$H" >> "$GITHUB_OUTPUT"
          echo "公開ホスト名の出どころ: $SRC(値は伏せた)"

      - id: upload
        name: "新しい版を作る(wrangler-action の versions upload。まだ 100% にはしない)"
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy-worker/upload.ndjson
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: versions upload --config wrangler.deploy.json --message "ci ${{ env.CI_SHORT_SHA }}"
          quiet: false

      - id: version
        name: "新しい版の ID を出力から読む(100% の版は変わっていない)"
        run: |
          set -u
          W="$RUNNER_TEMP/deploy-worker"
          cat > "$W/ndjson.py" <<'PY'
          import json
          import sys

          v = ""
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  r = json.loads(line)
              except ValueError:
                  continue
              if isinstance(r, dict) and r.get("type") == "version-upload":
                  v = r.get("version_id") or ""
          print(v)
          PY
          VID=$(python3 "$W/ndjson.py" "$W/upload.ndjson")
          if ! echo "$VID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "upload の出力から版の ID を得られない(100% の版は変わっていない)"
            exit 1
          fi
          echo "new_version=$VID" >> "$GITHUB_OUTPUT"
          echo "新しい版 $VID を作った(UTC $(date -u +%Y-%m-%dT%H:%M:%SZ))。まだ 100% ではない"

      - id: switch
        name: "新しい版を 100% にする(wrangler-action の versions deploy。失敗は次の段で確かめて戻す)"
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: versions deploy ${{ steps.version.outputs.new_version }}@100% --config wrangler.deploy.json --message "ci ${{ env.CI_SHORT_SHA }}" --yes
          quiet: false

      - id: check
        name: "確かめ。外れていれば直前の版へ戻す(失敗にする)"
        if: ${{ always() && steps.version.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          OLD_VERSION: ${{ steps.read.outputs.old_version }}
          SWITCH: ${{ steps.switch.outcome }}
        run: |
          set -u
          W="$RUNNER_TEMP/deploy-worker"
          echo "切り替え: 直前の版 $OLD_VERSION → 新しい版 $NEW_VERSION(切り替えの段の結果: $SWITCH。UTC $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          if [ "$SWITCH" = success ] && python3 "$W/cf.py" check "$NEW_VERSION"; then
            echo "結果: 新しい版 $NEW_VERSION が 100%。確かめた"
            exit 0
          fi
          echo "新しい版が 100% になっていないので、直前の版 $OLD_VERSION へ戻す"
          rb=0
          (cd app && npx wrangler versions deploy "${OLD_VERSION}@100%" --config wrangler.deploy.json --message "ci rollback ${GITHUB_SHA:0:12}" --yes) > "$W/rollback.log" 2>&1 || rb=$?
          grep -E '^(Deployed|Current Version ID|Version ID|Worker Version ID)|\[ERROR\]' "$W/rollback.log" | cut -c1-200 || true
          if [ "$rb" = 0 ] && python3 "$W/cf.py" check "$OLD_VERSION"; then
            echo "結果: 失敗。直前の版 $OLD_VERSION に戻し、確かめた(UTC $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          else
            echo "結果: 失敗。戻したことを確かめられなかった(戻しの終了 $rb)。手作業が要る"
          fi
          exit 1

      - id: probe
        name: "配信の後、公開の入口が Access の背後にあることを確かめる(Access なしで届いたら失敗)"
        env:
          PUBLIC_HOSTNAME: ${{ steps.host.outputs.public_host }}
        run: |
          set -u
          # METHOD|PATH|extra header. The paths need not exist: Access answers before the Worker is reached. The list and the judgment are those of archive/ci-old/ci/stage-deploy.sh (probe), without the bundle's manifest.
          reqs=("GET|/|" "GET|/static/probe.js|" "GET|/assets/manifest.json|" "GET|/assets/probe/engine.0000000000.wasm|" "GET|/__perf|" "GET|/__perf/summary|"
                "POST|/|" "POST|/assets/manifest.json|" "POST|/__perf|" "POST|/__perf/summary|" "HEAD|/assets/manifest.json|" "GET|/assets/manifest.json|Range: bytes=0-99")
          bad=0
          for r in "${reqs[@]}"; do
            IFS='|' read -r m p h <<<"$r"
            args=(-s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30)
            if [ "$m" = HEAD ]; then args+=(-I); else args+=(-X "$m"); fi
            [ -n "$h" ] && args+=(-H "$h")
            out=$(curl "${args[@]}" "https://$PUBLIC_HOSTNAME$p")
            case "$out" in
              "302 https://"*.cloudflareaccess.com/*) echo "ok   $m $p${h:+ [$h]} -> 302(Access)" ;;
              401*|403*) echo "ok   $m $p${h:+ [$h]} -> ${out%% *}" ;;
              *) echo "OPEN $m $p${h:+ [$h]} -> ${out%% *}"; bad=1 ;;
            esac
          done
          echo "probe: ${#reqs[@]} unauthenticated requests"
          if [ "$bad" != 0 ]; then
            echo "匿名の要求が Access に止められなかった(上の OPEN の行)。Worker のルートと、ホスト名の Access のアプリを確かめる"
            exit 1
          fi

      - name: "結果の表(失敗しても出す)"
        if: always()
        env:
          R_BUILD: ${{ steps.build.outcome }}
          R_UNIT: ${{ steps.unit.outcome }}
          R_WORKER: ${{ steps.worker.outcome }}
          R_READ: ${{ steps.read.outcome }}
          R_GEN: ${{ steps.gen.outcome }}
          R_HOST: ${{ steps.host.outcome }}
          R_UPLOAD: ${{ steps.upload.outcome }}
          R_VERSION: ${{ steps.version.outcome }}
          R_SWITCH: ${{ steps.switch.outcome }}
          R_CHECK: ${{ steps.check.outcome }}
          R_PROBE: ${{ steps.probe.outcome }}
          OLD_VERSION: ${{ steps.read.outputs.old_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          {
            echo "| 段 | 結果 |"
            echo "|---|---|"
            echo "| build | $R_BUILD |"
            echo "| test(vitest) | $R_UNIT |"
            echo "| test:worker | $R_WORKER |"
            echo "| 現在の版を読んだ(書かない) | $R_READ |"
            echo "| 配信設定を作った | $R_GEN |"
            echo "| 公開ホスト名を決めた(一覧か Secret。無ければ書く前に止まる) | $R_HOST |"
            echo "| versions upload(wrangler-action) | $R_UPLOAD |"
            echo "| 新しい版の ID を読んだ | $R_VERSION |"
            echo "| versions deploy(wrangler-action。100%) | $R_SWITCH |"
            echo "| 確かめと、外れたときの戻し | $R_CHECK |"
            echo "| 公開の入口が Access の背後にあるか(配信の後) | $R_PROBE |"
            echo "| 直前の版(100% だった版) | ${OLD_VERSION:-未取得} |"
            echo "| 新しい版 | ${NEW_VERSION:-未作成} |"
            echo "| 時刻(UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
