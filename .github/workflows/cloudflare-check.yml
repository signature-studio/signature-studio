# vars の値は公開ログに出る。ここでは使わない。アカウント ID は実行時に得て、すぐ伏せる。
name: cloudflare-check

on:
  push:
    paths:
      - ".github/workflows/cloudflare-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1 アカウント ID を実行時に得て、すぐ伏せる
        id: acct
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          WR=app/node_modules/.bin/wrangler
          if ! npm ci --prefix app --ignore-scripts --no-audit --no-fund > npm-ci.log 2>&1; then
            echo "依存関係の準備: 失敗"
          fi
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts > accounts.json 2>/dev/null || true
          python3 -c 'import json; d=json.load(open("accounts.json")); [print(a["id"]) for a in d.get("result", [])]' > ids.txt 2>/dev/null || true
          grep -E '^[0-9a-f]{32}$' ids.txt 2>/dev/null | sort -u > cand.txt || true
          if [ "$(wc -l < cand.txt | tr -d ' ')" -ne 1 ]; then
            "$WR" whoami > who.txt 2>&1 || true
            grep -oE '(^|[^0-9a-f])[0-9a-f]{32}([^0-9a-f]|$)' who.txt 2>/dev/null | grep -oE '[0-9a-f]{32}' | sort -u > cand.txt || true
          fi
          n=$(wc -l < cand.txt | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "アカウント ID を 1 つに決められない(件数: $n)"
            exit 1
          fi
          id=$(cat cand.txt)
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "アカウント ID を実行時に 1 つ得た(値は出さない)"

      - name: 2 API トークンで Worker の一覧を読む(wrangler の版は package-lock で固定)
        id: token
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          WR=app/node_modules/.bin/wrangler
          if [ ! -x "$WR" ]; then
            echo "wrangler が無い(依存関係の準備が失敗)"
            exit 1
          fi
          mask() {
            sed -E \
              -e "s/$CLOUDFLARE_ACCOUNT_ID/[アカウント ID 伏せ]/g" \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[メール伏せ]/g' \
              -e 's/[A-Za-z0-9.-]+\.workers\.dev/[ホスト伏せ]/g'
          }
          echo "wrangler の版: $(node -p "require('./app/node_modules/wrangler/package.json').version")"
          if "$WR" whoami > /dev/null 2>&1; then
            echo "wrangler whoami(参考): 成功"
          else
            echo "wrangler whoami(参考): 失敗"
          fi
          if "$WR" deployments list --name fl-studio-web > deploy.txt 2>&1; then
            mask < deploy.txt > deploy-masked.txt
            echo "deployments list: 成功"
            grep -E 'Version|Created|Deployment|[0-9]{4}-[0-9]{2}-[0-9]{2}' deploy-masked.txt | grep -v -i 'author' || true
          else
            echo "deployments list: 失敗"
            mask < deploy.txt | tail -n 20
            exit 1
          fi

      - name: 3a R2 のアクセスキー 1 組目を確かめる(fl-web-artifacts・読み取り)
        id: r2_artifact
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          status=0
          for bucket in fl-web-artifacts; do
            if aws s3 ls "s3://${bucket}/" --endpoint-url "$ENDPOINT" > ls.txt 2>&1; then
              echo "バケット ${bucket} の一覧: 成功"
              head -n 3 ls.txt | sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g'
            else
              echo "バケット ${bucket} の一覧: 失敗"
              sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g' ls.txt | tail -n 5
              status=1
            fi
          done
          exit $status

      - name: 3b R2 のアクセスキー 2 組目を確かめる(fl-web-cache・fl-web-assets)
        id: r2_cache_assets
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          status=0
          for bucket in fl-web-cache fl-web-assets; do
            opts=""
            max=3
            if [ "$bucket" = fl-web-assets ]; then
              opts="--recursive --human-readable --summarize"
              max=200
            fi
            if aws s3 ls "s3://${bucket}/" $opts --endpoint-url "$ENDPOINT" > ls.txt 2>&1; then
              echo "バケット ${bucket} の一覧: 成功"
              lines=$(wc -l < ls.txt | tr -d ' ')
              echo "バケット ${bucket} の行数: ${lines}"
              head -n "$max" ls.txt | sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g'
              if [ "$bucket" = fl-web-assets ] && [ "$lines" -gt "$max" ]; then
                echo "(末尾の集計行)"
                tail -n 2 ls.txt | sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g'
              fi
            else
              echo "バケット ${bucket} の一覧: 失敗"
              sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g' ls.txt | tail -n 5
              status=1
            fi
          done
          exit $status

      - name: 3c Worker fl-studio-web の現在の版を読む(wrangler deployments status・読み取り)
        id: deploy_status
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          WR=app/node_modules/.bin/wrangler
          if [ ! -x "$WR" ]; then
            echo "wrangler が無い(依存関係の準備が失敗)"
            exit 1
          fi
          mask() {
            sed -E \
              -e "s/$CLOUDFLARE_ACCOUNT_ID/[アカウント ID 伏せ]/g" \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[メール伏せ]/g' \
              -e 's/[A-Za-z0-9.-]+\.workers\.dev/[ホスト伏せ]/g' \
              -e 's/[A-Za-z0-9.-]+\.cloudflareaccess\.com/[ホスト伏せ]/g'
          }
          if "$WR" deployments status --name fl-studio-web > status.txt 2>&1; then
            echo "deployments status: 成功"
            mask < status.txt
          else
            echo "deployments status: 失敗"
            mask < status.txt | tail -n 20
            exit 1
          fi

      - name: 3d R2 の manifest.json の項目を読む(fl-web-assets・読み取り)
        id: r2_manifest
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3api get-object --bucket fl-web-assets --key manifest.json --endpoint-url "$ENDPOINT" "$RUNNER_TEMP/manifest.json" > get.txt 2> cp.txt; then
            python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          e = m.get("engine") if isinstance(m.get("engine"), dict) else {}
          w = e.get("wasm") if isinstance(e.get("wasm"), dict) else {}
          o = e.get("options") if isinstance(e.get("options"), dict) else {}
          p = (w.get("url") or "").split("/")
          print("manifest.json: 有")
          print(json.dumps({
            "engine.kind": e.get("kind"),
            "engine.wasm.size": w.get("size"),
            "engine.wasm.url の bundle 名": p[2] if len(p) > 3 and p[1] == "assets" else None,
            "engine.options のキー": sorted(o.keys()) if o else None,
            "generated": m.get("generated"),
          }, ensure_ascii=False, indent=1))
          PY
          elif grep -qE '404|Not Found|NoSuchKey' cp.txt; then
            echo "manifest.json: 直下に無い"
          else
            echo "manifest.json: 読めない(エラーの末尾)"
            sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g' cp.txt | tail -n 3
            exit 1
          fi

      - name: 3e R2 の E13(fl-engine-ci-0363b050)の 5 件を読み、ContentEncoding・大きさ・展開後の SHA-256 を出す(fl-web-assets・読み取り)
        id: r2_e13
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="fl-engine-ci-0363b050"
          mask() {
            sed -E -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g'
          }
          if ! aws s3 ls "s3://fl-web-assets/${PREFIX}/" --endpoint-url "$ENDPOINT" > ls-e13.txt 2> ls-e13.err; then
            echo "一覧: 失敗"
            mask < ls-e13.err | tail -n 5
            exit 1
          fi
          awk 'NF >= 4 {print $4}' ls-e13.txt > names-e13.txt
          echo "一覧: 成功(件数: $(wc -l < names-e13.txt | tr -d ' '))"
          E13="$RUNNER_TEMP/e13"
          mkdir -p "$E13/plain"
          status=0
          : > head-rows.txt
          : > sha-rows.txt
          while read -r name; do
            key="${PREFIX}/${name}"
            raw="$E13/${name}"
            if ! aws s3api get-object --bucket fl-web-assets --key "$key" --endpoint-url "$ENDPOINT" "$raw" > get-e13.txt 2> get-e13.err; then
              echo "| ${name} | 読めない | - | - | - |" >> sha-rows.txt
              echo "| ${name} | 読めない | - | - |" >> head-rows.txt
              mask < get-e13.err | tail -n 3
              status=1
              continue
            fi
            if ! aws s3api head-object --bucket fl-web-assets --key "$key" --endpoint-url "$ENDPOINT" --query '{ContentEncoding: ContentEncoding, ContentLength: ContentLength, ContentType: ContentType}' --output json > head-e13.json 2> head-e13.err; then
              echo "| ${name} | head-object 失敗 | - | - | - |" >> sha-rows.txt
              mask < head-e13.err | tail -n 3
              status=1
              continue
            fi
            node -e "const h=JSON.parse(require('fs').readFileSync('head-e13.json','utf8'));console.log(['|',process.argv[1],'|',h.ContentEncoding||'(無し)','|',h.ContentType||'(無し)','|',h.ContentLength,'|'].join(' '))" "$name" >> head-rows.txt
            enc=$(node -p "(JSON.parse(require('fs').readFileSync('head-e13.json','utf8')).ContentEncoding)||''")
            plain="$raw"
            if [ "$enc" = "br" ]; then
              plain="$E13/plain/${name}"
              if ! node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync(process.argv[2],z.brotliDecompressSync(fs.readFileSync(process.argv[1])))" "$raw" "$plain" > dec-e13.txt 2> dec-e13.err; then
                echo "| ${name} | br | $(stat -c %s "$raw") | 展開できない | - |" >> sha-rows.txt
                mask < dec-e13.err | tail -n 3
                status=1
                rm -f "$raw"
                continue
              fi
            fi
            echo "| ${name} | ${enc:-(無し)} | $(stat -c %s "$raw") | $(stat -c %s "$plain") | $(sha256sum "$plain" | cut -d' ' -f1) |" >> sha-rows.txt
            rm -f "$raw"
            if [ "$plain" != "$raw" ]; then rm -f "$plain"; fi
          done < names-e13.txt
          echo "| 名前 | ContentEncoding | ContentType | ContentLength(head-object) |"
          echo "|---|---|---|---:|"
          cat head-rows.txt
          echo "| 名前 | ContentEncoding | R2 の大きさ | 展開後の大きさ | 展開後の SHA-256 |"
          echo "|---|---|---:|---:|---|"
          cat sha-rows.txt
          exit $status

      - name: 3f 版 2cb938be の script を読み、現在の app/worker のビルドと比べる(読み取りだけ。アップロードしない)
        id: g1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "アカウント ID が未設定のため、この確認は行わない"
            exit 1
          fi
          VER=2cb938be-e32d-44e4-8268-1824660956fe
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fl-studio-web"
          G="$RUNNER_TEMP/g1"
          mkdir -p "$G"
          mask() {
            sed -E \
              -e "s/$CLOUDFLARE_ACCOUNT_ID/[伏せ]/g" \
              -e 's/[A-Za-z0-9.-]+\.workers\.dev/[ホスト伏せ]/g' \
              -e 's/[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com/[ホスト伏せ]/g'
          }
          curl -sS -o "$G/version.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/versions/$VER" > "$G/version.code" 2> "$G/version.err" || true
          curl -sS -D "$G/content.headers" -o "$G/content.bin" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/content/v2" > "$G/content.code" 2> "$G/content.err" || true
          if [ ! -x app/node_modules/.bin/wrangler ]; then
            echo "wrangler が無い(依存関係の準備が失敗)"
            exit 1
          fi
          if ( cd app && ./node_modules/.bin/wrangler deploy --dry-run --outdir "$G/out" ) > "$G/dry.log" 2>&1; then
            echo "現在のビルド(dry-run): 成功"
          else
            echo "現在のビルド(dry-run): 失敗(末尾 5 行、伏せ済み)"
            mask < "$G/dry.log" | tail -n 5
          fi
          python3 - "$G" "$VER" <<'PY'
          import glob, hashlib, json, os, sys
          from email import policy
          from email.parser import BytesParser
          G, VER = sys.argv[1], sys.argv[2]
          def sha(b): return hashlib.sha256(b).hexdigest()
          def rd(p, mode='rb'): return open(p, mode).read()
          def fail(msg):
              print(msg)
              sys.exit(1)
          vcode = rd(f'{G}/version.code', 'r').strip()
          print(f'版の詳細 GET の HTTP ステータス: {vcode}')
          if vcode != '200':
              fail('版の詳細が読めない(比べられない)')
          res = json.load(open(f'{G}/version.json')).get('result') or {}
          vetag = ((res.get('resources') or {}).get('script') or {}).get('etag')
          print(f'版の詳細: id が一致={res.get("id") == VER}、script.etag あり={vetag is not None}')
          ccode = rd(f'{G}/content.code', 'r').strip()
          print(f'script 本文 GET(content/v2)の HTTP ステータス: {ccode}')
          if ccode != '200':
              fail('本文が読めない(比べられない)')
          hdr = {}
          for line in open(f'{G}/content.headers', encoding='latin-1'):
              if ':' in line:
                  k, _, val = line.partition(':')
                  hdr[k.strip().lower()] = val.strip()
          body = rd(f'{G}/content.bin')
          ctype = hdr.get('content-type', '')
          print(f'本文の応答: Content-Type {ctype.split(";")[0]}、大きさ {len(body)} B、SHA-256 {sha(body)}')
          et = hdr.get('etag')
          if et is None or vetag is None:
              print('ETag の照合: 未確認(本文の応答か版の詳細に ETag が無い)')
          else:
              norm = lambda s: s.strip().removeprefix('W/').strip('"')
              print(f'ETag の照合(本文の応答と版の script.etag): {"一致" if norm(et) == norm(vetag) else "不一致(照合の方法が同じかは未確認)"}')
          if ctype.lower().startswith('multipart/'):
              msg = BytesParser(policy=policy.default).parsebytes(b'Content-Type: ' + ctype.encode('latin-1') + b'\r\n\r\n' + body)
              parts = []
              for p in msg.iter_parts():
                  data = p.get_payload(decode=True) or b''
                  name = p.get_filename() or p.get_param('name', header='content-disposition') or '?'
                  parts.append((str(name), p.get_content_type(), data))
              print('本文の部品: ' + '; '.join(f'{n} ({t}, {len(d)} B, SHA-256 {sha(d)})' for n, t, d in parts))
              mods = [x for x in parts if x[1] != 'application/json']
              if not mods:
                  fail('本文に module の部品が無い(比べられない)')
              main = max(mods, key=lambda x: len(x[2]))[2]
          else:
              main = body
          outs = sorted(glob.glob(f'{G}/out/*.js'), key=os.path.getsize, reverse=True)
          if not outs:
              fail('現在のビルドが無い(比べられない)')
          cur = rd(outs[0])
          print(f'現在のビルド: {os.path.basename(outs[0])}、大きさ {len(cur)} B、SHA-256 {sha(cur)}')
          print(f'大きさ: 版の module {len(main)} B / 現在のビルド {len(cur)} B')
          print(f'版の module と現在のビルドの SHA-256: {"一致" if sha(main) == sha(cur) else "不一致"}')
          for pat in [b'manifest.json', b'no-cache', b'caches.default', b'cacheTtl', b'cacheEverything', b'emscripten-fruity-v1']:
              print(f'{pat.decode()} の件数: 版 {main.count(pat)} / 現在 {cur.count(pat)}')
          print('比較は完了(一致・不一致は上の行)')
          PY

      - name: 4 結果の表
        if: always()
        env:
          R_ACCT: ${{ steps.acct.outcome }}
          R_TOKEN: ${{ steps.token.outcome }}
          R_ART: ${{ steps.r2_artifact.outcome }}
          R_CACHE: ${{ steps.r2_cache_assets.outcome }}
          R_DEP: ${{ steps.deploy_status.outcome }}
          R_MAN: ${{ steps.r2_manifest.outcome }}
          R_E13: ${{ steps.r2_e13.outcome }}
          R_G1: ${{ steps.g1.outcome }}
        run: |
          fail=0
          line() {
            if [ "$2" = "success" ]; then
              r="成功"
            else
              r="失敗"
              fail=1
            fi
            echo "| $1 | $r |"
          }
          echo "| 確認 | 結果 |"
          echo "|---|---|"
          line "1 アカウント ID を実行時に得た" "$R_ACCT"
          line "2 API トークン(Worker fl-studio-web の一覧)" "$R_TOKEN"
          line "3a R2 のキー 1 組目(fl-web-artifacts の読み取り)" "$R_ART"
          line "3b R2 のキー 2 組目(fl-web-cache・fl-web-assets の読み取り)" "$R_CACHE"
          line "3c Worker fl-studio-web の現在の版(wrangler deployments status)" "$R_DEP"
          line "3d R2 の manifest.json の項目(fl-web-assets の読み取り)" "$R_MAN"
          line "3e R2 の E13 の 5 件(fl-web-assets の読み取り)" "$R_E13"
          line "3f 版 2cb938be の script と現在の app/worker のビルドの比較(読み取り)" "$R_G1"
          exit $fail
