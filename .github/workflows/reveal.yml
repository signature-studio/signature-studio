name: reveal
on:
  push:
    paths: [".github/workflows/reveal.yml"]
permissions:
  contents: read
jobs:
  reveal:
    runs-on: ubuntu-24.04
    steps:
    - env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        A=https://api.cloudflare.com/client/v4
        H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        g() { curl -sSf -H "$H" "$A$1"; }
        ID=$(g /accounts | jq -r '.result[0].id')
        echo "ACCT=$ID"
        echo "COUNT=$(g /accounts | jq '.result | length')"
        S=/accounts/$ID/workers/scripts/fl-studio-web
        V=$(g "$S/deployments" | jq -r '.result.deployments[0].versions[0].version_id')
        echo "VER=$V"
        g "$S/versions/$V" | jq -r '.result.resources.bindings[] | "B \(.type) \(.name) \(.bucket_name // "-") \(.text // "-")"'
        g "/accounts/$ID/workers/domains?service=fl-studio-web" | jq -r '.result[] | "D \(.hostname) \(.zone_name)"' || echo "D none"
