on:
  push:
    branches: main
    paths:
      - app/**
      - lift/**
      - ci/**
      - .github/workflows/deploy.yml
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
      RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
      RUNS_ON_S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - run: npm ci --prefix app
      - run: npm run build --prefix app
      - run: cargo build --release --locked --manifest-path lift/Cargo.toml
      - run: lift/target/release/fe-build endpoint
      - id: cache
        uses: runs-on/cache@v5.0.7
        with:
          path: lift/out-app/host
          key: >-
            host-${{ hashFiles('ci/**', 'app/scripts/**/*.mjs',
            'lift/crates/fe-build/src/main.rs',
            'lift/harness/seeds/os-fonts/**',
            'lift/harness/seeds/vfs-seed-idle1.tsv', 'lift/plugins/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: lift/target/release/fe-build extract
      - name: resources を取り出す
        env:
          SRC: s3://fl-web-artifacts/installers/flstudio_win64_26.1.7.5653.exe
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$SRC" "$RUNNER_TEMP/i.exe"
          mapfile -t p < ci/resources-prefixes.txt
          node tools/fl-installer-extract.mjs "$RUNNER_TEMP/i.exe" \
            lift/out-app/host-extra/resources "${p[@]}"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.0
      - run: lift/target/release/fe-build engine
      - run: lift/target/release/fe-build bundle
      # 本番へ上げる前の検査(起動・Welcome 窓の流れ)
      - run: |
          node tools/boot-check/boot-bundle.mjs \
            "$PWD/lift/out-app/bundle/raw/fl-Oz" > "$RUNNER_TEMP/boot.json"
        timeout-minutes: 15
      - run: |
          jq -e '.error == null and .standIn == false and
            .state == "engine-idle"' "$RUNNER_TEMP/boot.json"
      - run: |
          node tools/smoke/welcome-flow.mjs \
            "$PWD/lift/out-app/bundle/raw/fl-Oz" > "$RUNNER_TEMP/flow.jsonl"
        timeout-minutes: 30
      - run: |
          jq -e -s '
            length == 4 and ([.[].flow] == ["A", "B", "C", "D"]) and
            all(.[]; .error == null and .trapped == false and
            .state == "engine-idle" and .opened and .welcomeClosed)
          ' "$RUNNER_TEMP/flow.jsonl"
      - name: bundle の中身を確かめる
        run: |
          jq -e --arg o resources/System/Internet/error-offline.html \
            '.lazy | any(.path == $o)' \
            lift/out-app/bundle/raw/fl-Oz/manifest.json
          jq -e '[.files[].path] as $f | all(
            "seed/resources/System/Languages/de.moe",
            "seed/resources/Artwork/Fonts/Cuprum/Cuprum.ttf",
            "seed/resources/Data/Templates/Other/Blocks/Blocks.flp";
            . as $x | $f | any(. == $x))' \
            lift/out-app/seed/seed.bin.manifest.json
      - run: lift/target/release/fe-build upload
      - name: 本番の manifest を確かめる
        run: |
          L="$RUNNER_TEMP/live.json"
          aws s3 cp s3://fl-web-assets/manifest.json "$L"
          cmp -s "$L" lift/out-app/bundle/raw/fl-Oz/manifest.json || {
            echo "manifest: 本番が差し替わっていない"; exit 1
          }
          echo "manifest: この build と一致"
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: app
          command: deploy
