# e2e.yml が成功した後にだけ動く(workflow_run)
on:
  workflow_run: {workflows: [e2e], types: [completed]}
concurrency: deploy
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env: {AWS_REGION: auto, RUNS_ON_S3_BUCKET_CACHE: fl-web-cache,
      RUNS_ON_S3_FORCE_PATH_STYLE: "true",
      AWS_ACCESS_KEY_ID: "${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}",
      AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}"}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: "${{ github.event.workflow_run.head_sha }}"}
      - {uses: actions/setup-node@v7.1.0, with: {node-version: 26}}
      - run: npm ci --prefix app
      - run: cargo build --release --locked --manifest-path lift/Cargo.toml
      - run: lift/target/release/fe-build endpoint
      - name: bundle をキャッシュから取る
        uses: runs-on/cache@v5.0.7
        with:
          path: |
            app/dist
            lift/out-app/bundle
          key: bundle-${{ github.event.workflow_run.head_sha }}
          fail-on-cache-miss: true
      - run: lift/target/release/fe-build upload
      - name: 本番の manifest を確かめる
        run: |
          L="$RUNNER_TEMP/live.json"
          aws s3 cp s3://fl-web-assets/manifest.json "$L"
          cmp -s "$L" lift/out-app/bundle/raw/fl-Oz/manifest.json || {
            echo "manifest: 本番が差し替わっていない"; exit 1
          }
          echo "manifest: この build と一致"
      - uses: cloudflare/wrangler-action@v4.1.3
        with: {apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}",
          workingDirectory: app, command: deploy}
