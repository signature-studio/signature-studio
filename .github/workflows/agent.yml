# 作業者(Haiku 5.5)を、Issue 1 件につき 1 ジョブで動かす。前の世代の agent.yml(実際に動いた物)の段を、そのまま移した。
# 駆動は Issues のイベント。設計は pm-work/workflow-design.md。起動する Issue は tools/select-targets.mjs が決める。
#   select: 候補を集め、起動してよい物を選ぶ。start: 起動する Issue に running を付ける(再確認してから)。
#   extract: 抽出物を R2 のキャッシュから用意する。work: Issue ごとに作業し、判定し、通った変更だけを main に push する。
#   report: 結果を Issue に書き、状態を変える(通った: running を外す。落ちた: failed)。
# ラベル・コメントは GITHUB_TOKEN で行う。GITHUB_TOKEN で行った変更は、次の run を起動しないため。
# 通った Issue の close は、push する commit の Closes #N で行う。push は App の token で行うので、閉じた事象が次の run を起動する。
# 鍵は、名義の設定の段と、最後の push の段にだけ渡す。作業者の段には、どの token も無い。
# 抽出物(FL の DLL など)は R2 のキャッシュだけに置き、公開の artifact には置かない。
# インストーラの一覧(inventory)と外部プラグイン(plugin-external)は、そのラベルの Issue が起動したときだけ、extract の段で取り、R2 のキャッシュに置く。作業の段は、キャッシュから inputs/ と lift/out-app/external/ に置く(commit はしない)。
name: agent
run-name: agent ${{ github.event_name }} #${{ github.event.issue.number }}

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, typed, untyped]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  select:
    name: 起動する Issue を決める
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      retry: ${{ steps.pick.outputs.retry }}
      labels: ${{ steps.pick.outputs.labels }}
      issue_labels: ${{ steps.pick.outputs.issue_labels }}
    steps:
      - name: リポジトリを取得する(資格は残さない)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 条件を満たす Issue を選ぶ(起動しない理由は、ログに 1 件ずつ出す)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$(node tools/select-targets.mjs select)
          echo "$out"
          echo "targets=$(jq -c .targets <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "retry=$(jq -r .retry <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r .labels <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "issue_labels=$(jq -c .issue_labels <<<"$out")" >> "$GITHUB_OUTPUT"

  start:
    name: 起動する Issue に running を付ける
    needs: select
    if: success() && needs.select.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: リポジトリを取得する(資格は残さない)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 起動してよい物に running を付ける(GITHUB_TOKEN で。失敗・再試行の判定は、もう一度行う)
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ needs.select.outputs.targets }}
          RETRY: ${{ needs.select.outputs.retry }}
        run: |
          out=$(node tools/select-targets.mjs claim "$TARGETS" "$RETRY")
          echo "$out"
          echo "claimed=$(jq -c .claimed <<<"$out")" >> "$GITHUB_OUTPUT"

  extract:
    name: 抽出物を用意する
    needs: [select, start]
    if: success() && needs.start.outputs.claimed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: アカウント ID を app/wrangler.jsonc から読む
        run: |
          echo "CF_ACCOUNT=$(grep '"account_id"' app/wrangler.jsonc | cut -d'"' -f4)" >> "$GITHUB_ENV"

      - name: 抽出物のキャッシュ(R2)
        id: cache
        uses: runs-on/cache@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/host
          key: extract-tree-${{ hashFiles('ci/artifacts.lock', 'ci/extract-dlls.tsv', 'app/scripts/extract-fl.mjs', 'app/scripts/lib/*.mjs', 'lift/harness/seeds/vfs-seed-idle1.tsv') }}

      - name: インストーラを取り、抽出する(キャッシュが無いときだけ)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/host"
          aws s3 cp s3://fl-web-artifacts/installers/flstudio_win64_26.1.7.5653.exe "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe" --endpoint-url "https://${CF_ACCOUNT}.r2.cloudflarestorage.com"
          node app/scripts/extract-fl.mjs "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe" "$RUNNER_TEMP/host" --dlls ci/extract-dlls.tsv --seed lift/harness/seeds/vfs-seed-idle1.tsv
          rm -f "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe"

      - name: インストーラの一覧(inventory)のキャッシュ(R2)
        if: contains(format(',{0},', needs.select.outputs.labels), ',inventory,')
        id: inventory
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/inventory
          key: inventory-${{ hashFiles('ci/artifacts.lock', 'tools/fl-installer-files.mjs', 'app/scripts/lib/*.mjs') }}

      - name: インストーラの一覧(inventory)を作る(キャッシュが無いときだけ)
        if: contains(format(',{0},', needs.select.outputs.labels), ',inventory,') && steps.inventory.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/inventory"
          aws s3 cp s3://fl-web-artifacts/installers/flstudio_win64_26.1.7.5653.exe "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe" --endpoint-url "https://${CF_ACCOUNT}.r2.cloudflarestorage.com"
          node tools/fl-installer-files.mjs "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe" "$RUNNER_TEMP/inventory/fl-installer-files.tsv"
          rm -f "$RUNNER_TEMP/in/flstudio_win64_26.1.7.5653.exe"

      - name: インストーラの一覧(inventory)をキャッシュに保存する(作ったときだけ)
        if: contains(format(',{0},', needs.select.outputs.labels), ',inventory,') && steps.inventory.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/inventory
          key: inventory-${{ hashFiles('ci/artifacts.lock', 'tools/fl-installer-files.mjs', 'app/scripts/lib/*.mjs') }}

      - name: 外部プラグインのキャッシュ(R2)
        if: contains(format(',{0},', needs.select.outputs.labels), ',plugin-external,')
        id: external
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/external
          key: external-${{ hashFiles('ci/artifacts.lock', 'tools/external-inputs/check.mjs') }}

      - name: 外部プラグインのインストーラを取り、照合する(キャッシュが無いときだけ)
        if: contains(format(',{0},', needs.select.outputs.labels), ',plugin-external,') && steps.external.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          mkdir -p "$RUNNER_TEMP/external"
          awk -F'\t' '$1 ~ /^installers\// && $1 !~ /^installers\/flstudio_/ {print $1}' ci/artifacts.lock | while read -r key; do
            aws s3 cp "s3://fl-web-artifacts/$key" "$RUNNER_TEMP/external/$(basename "$key")" --endpoint-url "https://${CF_ACCOUNT}.r2.cloudflarestorage.com"
          done
          node tools/external-inputs/check.mjs "$RUNNER_TEMP/external"

      - name: 外部プラグインのインストーラをキャッシュに保存する(取ったときだけ)
        if: contains(format(',{0},', needs.select.outputs.labels), ',plugin-external,') && steps.external.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/external
          key: external-${{ hashFiles('ci/artifacts.lock', 'tools/external-inputs/check.mjs') }}

  work:
    name: '作業 #${{ matrix.issue }}'
    needs: [select, start, extract]
    if: success() && needs.start.outputs.claimed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.start.outputs.claimed || '[]') }}
    concurrency:
      group: task-${{ matrix.issue }}
      cancel-in-progress: false
    env:
      ISSUE: ${{ matrix.issue }}
    steps:
      - name: リポジトリを取得する(資格は残さない)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 名義を設定する(token は消す)
        env:
          APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GH_APP_PEM }}
          APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: |
          v=0.2.3; f=botid_${v}_linux_amd64.tar.gz; b=$RUNNER_TEMP/botid-bin
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/pycabbage/botid/releases/download/v$v/$f"
          echo "fffa02853f88cf20637970f219f682c7a7768427169d4dc883491995d019fc50  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$b" ~/.config/botid && tar -xzf "$RUNNER_TEMP/$f" -C "$b" botid
          umask 077
          jq -n --arg c "$APP_CLIENT_ID" --arg k "$APP_PRIVATE_KEY" --argjson i "$APP_INSTALLATION_ID" \
            '{default: "worker", identities: {worker: {clientId: $c, privateKey: $k, installationId: $i}}}' \
            > "$RUNNER_TEMP/botid-config.json"
          cp "$RUNNER_TEMP/botid-config.json" ~/.config/botid/config.json
          "$b/botid" issue 2>/dev/null
          e=$("$b/botid" env --format json --cwd "$GITHUB_WORKSPACE")
          echo "GIT_CONFIG_GLOBAL=$(printf '%s' "$e" | jq -r .GIT_CONFIG_GLOBAL)" >> "$GITHUB_ENV"
          echo "BOTID_GH=$(printf '%s' "$e" | jq -r .GH_CONFIG_DIR)" >> "$GITHUB_ENV"
          rm -f ~/.config/botid/config.json "$(printf '%s' "$e" | jq -r .GH_CONFIG_DIR)/hosts.yml"

      - name: 版の値を ci/versions.env から読む
        run: |
          echo "NODE_VERSION=$(grep '^NODE_VERSION=' ci/versions.env | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "EMSDK_VERSION=$(grep '^EMSDK_VERSION=' ci/versions.env | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RUST_TOOLCHAIN=$(grep '^RUST_TOOLCHAIN=' ci/versions.env | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Node を入れる
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: rust をそろえ、app の依存を入れてビルドし、fe-build を用意する
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          npm ci --prefix app
          npm run build --prefix app
          cargo build --release --locked --manifest-path lift/Cargo.toml

      - name: emsdk を入れる
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: アカウント ID を app/wrangler.jsonc から読む
        run: echo "CF_ACCOUNT=$(grep '"account_id"' app/wrangler.jsonc | cut -d'"' -f4)" >> "$GITHUB_ENV"

      - name: 抽出物を R2 のキャッシュから取る(公開の artifact は使わない)
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/host
          key: extract-tree-${{ hashFiles('ci/artifacts.lock', 'ci/extract-dlls.tsv', 'app/scripts/extract-fl.mjs', 'app/scripts/lib/*.mjs', 'lift/harness/seeds/vfs-seed-idle1.tsv') }}
          fail-on-cache-miss: true

      - name: 抽出物を lift/out-app/host に置く
        run: |
          mkdir -p lift/out-app
          mv "$RUNNER_TEMP/host" lift/out-app/host
          test -f lift/out-app/host/binaries/win64/FLEngine_x64.dll

      - name: インストーラの一覧(inventory)を R2 のキャッシュから取る(inventory の作業だけ)
        if: contains(format(',{0},', fromJSON(needs.select.outputs.issue_labels)[format('{0}', matrix.issue)]), ',inventory,')
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/inventory
          key: inventory-${{ hashFiles('ci/artifacts.lock', 'tools/fl-installer-files.mjs', 'app/scripts/lib/*.mjs') }}
          fail-on-cache-miss: true

      - name: 一覧を作業ツリーの inputs/ に置く(inventory の作業だけ。commit は作業者が行う)
        if: contains(format(',{0},', fromJSON(needs.select.outputs.issue_labels)[format('{0}', matrix.issue)]), ',inventory,')
        run: |
          mkdir -p inputs
          cp "$RUNNER_TEMP/inventory/fl-installer-files.tsv" inputs/fl-installer-files.tsv

      - name: 外部プラグインのインストーラを R2 のキャッシュから取る(plugin-external の作業だけ)
        if: contains(format(',{0},', fromJSON(needs.select.outputs.issue_labels)[format('{0}', matrix.issue)]), ',plugin-external,')
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: fl-web-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://${{ env.CF_ACCOUNT }}.r2.cloudflarestorage.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}
        with:
          path: ${{ runner.temp }}/external
          key: external-${{ hashFiles('ci/artifacts.lock', 'tools/external-inputs/check.mjs') }}
          fail-on-cache-miss: true

      - name: 外部プラグインを lift/out-app/external に置き、照合する(plugin-external の作業だけ)
        if: contains(format(',{0},', fromJSON(needs.select.outputs.issue_labels)[format('{0}', matrix.issue)]), ',plugin-external,')
        run: |
          set -o pipefail
          mkdir -p lift/out-app/external "$RUNNER_TEMP/out"
          mv "$RUNNER_TEMP/external"/* lift/out-app/external/
          node tools/external-inputs/check.mjs lift/out-app/external | tee "$RUNNER_TEMP/out/external-check.txt"

      - name: タスク(Issue の本文と題名)を取り、受け入れコマンドを取り出す
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gh api "repos/$GH_REPO/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/task.md"
          jq -r .title "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/title.txt"
          node tools/task-accept.mjs < "$RUNNER_TEMP/task.md" > "$RUNNER_TEMP/task-accept.md" 2> "$RUNNER_TEMP/out/judge.txt"

      - name: opencode を導入する(版は固定)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cli.tgz" https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-2.3.0.tgz
          test "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/cli.tgz" | base64 -w0)" = 'sha512-8T3K8L6Nd4fSG5BSgofqhmIDQ1ZvzDZZ2J7bFVB9RK1d5Hjqh24IcxgbcwpgGKkdvItrayi4Rl+wrSmhl17FFg=='
          tar -xzf "$RUNNER_TEMP/cli.tgz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/package/bin/opencode" "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: opencode の認証情報を取り込み、作業者のモデルを設定する
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          printf '%s' "$OPENCODE_AUTH_JSON" | opencode auth import --standalone
          mkdir -p .opencode
          printf '{"model":"%s","agents":{"worker":{"model":"%s"},"title":{"model":"%s"},"summary":{"model":"%s"}}}\n' "$OPENCODE_MODEL" "$OPENCODE_MODEL" "$OPENCODE_MODEL" "$OPENCODE_MODEL" > .opencode/opencode.jsonc

      - name: 作業者のプロンプトを作る(AGENTS.md と、Issue の本文)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          { cat AGENTS.md; printf '\n\n---\n\n## タスク(Issue #%s)\n\n' "$ISSUE"; cat "$RUNNER_TEMP/task.md"; } > "$RUNNER_TEMP/prompt.md"

      - name: 作業者を 1 回動かす
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          opencode run --agent worker "$(cat "$RUNNER_TEMP/prompt.md")" > "$RUNNER_TEMP/out/report.md" 2> "$RUNNER_TEMP/stderr.log" < /dev/null || true
          rm -rf .opencode

      - name: 判定の道具を、取り直した main から取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          git fetch --no-tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" +refs/heads/main:refs/judge/main
          mkdir -p "$RUNNER_TEMP/guard"
          for f in judge.sh scan.sh flags.sh; do git show "refs/judge/main:guard/$f" > "$RUNNER_TEMP/guard/$f"; done

      - name: 判定(取り直した main の guard/judge.sh と、Issue の受け入れコマンドで)
        run: |
          set -o pipefail
          bash "$RUNNER_TEMP/guard/judge.sh" refs/judge/main "$RUNNER_TEMP/task-accept.md" 2>&1 | tee "$RUNNER_TEMP/out/judge.txt"

      - name: 通った変更を main に push する(token はこの段で発行する)
        env:
          APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GH_APP_PEM }}
          APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: |
          git commit --allow-empty -m "$(cat "$RUNNER_TEMP/title.txt"): 完了 (Closes #$ISSUE)"
          mkdir -p ~/.config/botid && cp "$RUNNER_TEMP/botid-config.json" ~/.config/botid/config.json
          "$RUNNER_TEMP/botid-bin/botid" issue 2>/dev/null
          export GH_CONFIG_DIR=$BOTID_GH
          for i in 1 2 3; do
            if git pull --no-rebase --no-edit "https://github.com/$GITHUB_REPOSITORY.git" main; then
              if git push origin HEAD:main; then git rev-parse HEAD > "$RUNNER_TEMP/out/commit.txt"; exit 0; fi
            else
              c=$(git diff --name-only --diff-filter=U | paste -sd' ' -)
              if [ -n "$c" ]; then echo "衝突: $c"; else echo "pull が失敗した($i 回目)"; fi
              git merge --abort 2>/dev/null || true
            fi
          done
          exit 1

      - name: 報告を検査して、成果物とサマリーに出す
        if: always()
        run: |
          touch "$RUNNER_TEMP/out/report.md"
          git show "refs/judge/main:guard/scan.sh" > "$RUNNER_TEMP/scan.sh" 2>/dev/null || cp guard/scan.sh "$RUNNER_TEMP/scan.sh"
          bash "$RUNNER_TEMP/scan.sh" "$RUNNER_TEMP/out/report.md"
          { echo "### 作業 #$ISSUE"; head -n 80 "$RUNNER_TEMP/out/report.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: 報告と判定の出力を成果物に保存する(7 日)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-${{ matrix.issue }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: 結果を Issue に書き、状態を変える
    needs: [start, work]
    if: always() && needs.start.result == 'success' && needs.start.outputs.claimed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      CLAIMED: ${{ needs.start.outputs.claimed }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SERVER: ${{ github.server_url }}
    steps:
      - name: リポジトリを取得する(資格は残さない)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 結果を集める(GITHUB_TOKEN。読むだけ)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, conclusion, failed: [.steps[]? | select(.conclusion == "failure") | .name]}' | jq -s . > "$RUNNER_TEMP/report/jobs.json"
          for n in $(jq -r '.[]' <<<"$CLAIMED"); do
            d="$RUNNER_TEMP/report/$n"; mkdir -p "$d"
            gh run download "$RUN_ID" -n "agent-$n" -D "$d" >/dev/null 2>&1 || true
            conc=$(jq -r --arg me "作業 #$n" '[.[] | select(.name == $me)][0].conclusion // "なし"' "$RUNNER_TEMP/report/jobs.json")
            failed=$(jq -r --arg me "作業 #$n" '[.[] | select(.name == $me or (.name | startswith("作業 #") | not)) | select(.conclusion == "failure") | .failed[]] | join(", ")' "$RUNNER_TEMP/report/jobs.json")
            tail_=""; if [ -s "$d/judge.txt" ]; then tail_=$(tail -n 8 "$d/judge.txt"); fi
            sha=""; if [ -s "$d/commit.txt" ]; then sha=$(cat "$d/commit.txt"); fi
            if [ "$conc" = success ]; then
              echo success > "$d/status"
              { echo "通った: $RUN_URL"; if [ -n "$sha" ]; then echo "commit: $SERVER/$GH_REPO/commit/$sha"; else echo "commit: 変更なし"; fi; echo "受け入れの出力(末尾 8 行):"; echo "${tail_:-(出力が無い)}"; } > "$d/comment.md"
            else
              echo failure > "$d/status"
              { echo "落ちた: $RUN_URL"; echo "作業の状態: $conc"; echo "失敗した段: ${failed:-(取れなかった。ジョブのログを見る)}"; echo "判定の出力(末尾 8 行):"; echo "${tail_:-(判定の出力が無い。ジョブのログを見る)}"; } > "$d/comment.md"
            fi
          done

      - name: 結果を Issue に書き、状態を変える(GITHUB_TOKEN で。通った Issue が開いたままなら、ここで閉じる)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(jq -r '.[]' <<<"$CLAIMED"); do
            d="$RUNNER_TEMP/report/$n"
            if [ "$(cat "$d/status")" = success ]; then
              if [ "$(gh api "repos/$GH_REPO/issues/$n" --jq .state)" = open ]; then
                echo "close を commit のキーワードで行えなかったので、後続の Issue は起動しない。PM が再評価する" >> "$d/comment.md"
                gh issue comment "$n" --repo "$GH_REPO" --body-file "$d/comment.md"
                gh issue close "$n" --repo "$GH_REPO" --reason completed
              else
                gh issue comment "$n" --repo "$GH_REPO" --body-file "$d/comment.md"
              fi
              gh issue edit "$n" --repo "$GH_REPO" --remove-label running
            else
              gh issue comment "$n" --repo "$GH_REPO" --body-file "$d/comment.md"
              gh issue edit "$n" --repo "$GH_REPO" --add-label failed
              gh issue edit "$n" --repo "$GH_REPO" --remove-label running
            fi
          done
