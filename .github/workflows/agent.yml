# ci/tasks/<名前>.md を push すると、ファイルごとに 1 ジョブ(最大 60 並列)で worker を 1 回動かす(決定 0380)。
# モデルの認証は、opencode の認証情報(環境変数 OPENCODE_AUTH_JSON)を取り込んで使う(決定 0383)。値が空のジョブは、取り込みの手順で止まる。
# モデルは Variable OPENCODE_MODEL(依頼者が登録)の値を、設定の段で .opencode/opencode.jsonc に書く(決定 0402。決定 0399 を置き換える)。値はログに出る。
# R2 の鍵は、抽出物を用意する段(extract ジョブと、各 worker ジョブの復元の段。.github/actions/extract-layer)にだけ渡す。モデルが動く段には渡さない(決定 0386)。
# 出力は scripts/scan-forbidden.sh を通してから、成果物とサマリーに出す。
name: agent

on:
  push:
    branches: [main]
    paths:
      - "ci/tasks/*.md"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

jobs:
  plan:
    name: 実行するタスクを決める
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: リポジトリを取得する(差分の基準の commit が要るため全履歴)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 追加・変更されたタスクを一覧にする
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash ci/agents/plan.sh "$BEFORE" "$AFTER"

  extract:
    name: 抽出物を用意する
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 抽出の層
        uses: ./.github/actions/extract-layer
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          artifact-access-key-id: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          artifact-secret-access-key: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          cache-access-key-id: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          cache-secret-access-key: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}

  run:
    name: worker ${{ matrix.task }}
    needs: [plan, extract]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 抽出物を復元する
        uses: ./.github/actions/extract-layer
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          artifact-access-key-id: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          artifact-secret-access-key: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          cache-access-key-id: ${{ secrets.R2_CACHE_ASSETS_ACCESS_KEY_ID }}
          cache-secret-access-key: ${{ secrets.R2_CACHE_ASSETS_SECRET_ACCESS_KEY }}

      - name: opencode を導入する(版は固定)
        run: bash ci/agents/install-opencode.sh

      - name: opencode の認証情報を取り込む
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: printf '%s' "$OPENCODE_AUTH_JSON" | opencode auth import --standalone

      - name: 実行用のモデルの設定を書く
        run: |
          mkdir -p .opencode
          cat > .opencode/opencode.jsonc << EOF
          {
            "model": "${{ vars.OPENCODE_MODEL }}",
            "default_agent": "worker",
            "agents": {
              "build": { "model": "${{ vars.OPENCODE_MODEL }}" },
              "worker": { "mode": "all", "model": "${{ vars.OPENCODE_MODEL }}" },
              "reviewer": { "model": "${{ vars.OPENCODE_MODEL }}" },
              "title": { "model": "${{ vars.OPENCODE_MODEL }}" },
              "summary": { "model": "${{ vars.OPENCODE_MODEL }}" }
            }
          }
          EOF

      - name: worker を 1 回動かす
        id: worker
        env:
          TASK: ${{ matrix.task }}
        run: bash ci/agents/run-task.sh "$TASK"

      - name: 出力を検査する(公開ログと成果物に出せるかを確かめる)
        env:
          TASK: ${{ matrix.task }}
        run: bash scripts/scan-forbidden.sh "ci/agents/out/$TASK"

      - name: 成果物を保存する(7 日)
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.task }}
          path: ci/agents/out/${{ matrix.task }}/
          retention-days: 7
          if-no-files-found: error

      - name: 要約をジョブのサマリーに書く
        env:
          TASK: ${{ matrix.task }}
        run: bash ci/agents/summary.sh "$TASK" >> "$GITHUB_STEP_SUMMARY"

