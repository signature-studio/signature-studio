# ci/tasks/<名前>.md を push すると、ファイルごとに 1 ジョブ(最大 60 並列)で worker を 1 回動かす(決定 0380)。
# モデルの認証は、依頼者の opencode の認証情報(Secret OPENCODE_AUTH_JSON)を取り込んで使う(決定 0383)。Secret が無いジョブは、取り込みの手順で止まる(Issue 0005)。
# モデルは Variable OPENCODE_MODEL で指定する(依頼者が設定。空なら check-agents が取り込みの後で止まる。決定 0384 と Issue 0006)。
# Cloudflare の Secrets は渡さない。出力は scripts/scan-forbidden.sh を通してから、成果物とサマリーに出す。
name: agent

on:
  push:
    branches: [main]
    paths:
      - "ci/tasks/*.md"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

jobs:
  plan:
    name: 実行するタスクを決める
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: リポジトリを取得する(差分の基準の commit が要るため全履歴)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 追加・変更されたタスクを一覧にする
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash ci/agents/plan.sh "$BEFORE" "$AFTER"

  run:
    name: worker ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: opencode を導入する(版は固定)
        run: bash ci/agents/install-opencode.sh

      - name: 実行用のモデルの設定を書く(最初の opencode の前に書く。決定 0384)
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: bash ci/agents/runner-config.sh

      - name: 依頼者の opencode の認証情報を取り込む(値は表示しない)
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: bash ci/agents/import-login.sh

      - name: 設定を確かめる(モデルと拒否の規則)
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: bash ci/agents/check-agents.sh

      - name: worker を 1 回動かす
        id: worker
        env:
          TASK: ${{ matrix.task }}
        run: bash ci/agents/run-task.sh "$TASK"

      - name: 出力を検査する(公開ログと成果物に出せるかを確かめる)
        env:
          TASK: ${{ matrix.task }}
        run: bash scripts/scan-forbidden.sh "ci/agents/out/$TASK"

      - name: 成果物を保存する(7 日)
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.task }}
          path: ci/agents/out/${{ matrix.task }}/
          retention-days: 7
          if-no-files-found: error

      - name: 要約をジョブのサマリーに書く
        env:
          TASK: ${{ matrix.task }}
        run: bash ci/agents/summary.sh "$TASK" >> "$GITHUB_STEP_SUMMARY"

      - name: worker の終了を確かめる
        if: always() && steps.worker.outcome != 'skipped'
        env:
          TASK: ${{ matrix.task }}
        run: 'grep -qx "rc: 0" "ci/agents/out/$TASK/meta.txt"'
